<!doctype html><html lang="pt-BR" data-theme="{{ default_theme }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1565c0"><title>Configurações — {{ title }}</title><link rel="stylesheet" href="/static/style.css"></head><body data-csrf="{{ csrf }}"><header class="app-bar"><div class="app-title"><a class="icon-button" href="/"><span class="material-symbol">arrow_back</span></a><div><strong>Configurações</strong><small>{{ title }}</small></div></div></header><main class="settings-shell"><form id="settings-form" class="settings-card"><h2>Dashboard</h2><div class="form-grid"><label>Título<input name="DASHBOARD_TITLE" value="{{ values.DASHBOARD_TITLE }}"></label><label>Usuário<input name="DASHBOARD_USERNAME" value="{{ values.DASHBOARD_USERNAME }}"></label><label>Nova senha<input type="password" name="DASHBOARD_PASSWORD" value="{{ values.DASHBOARD_PASSWORD }}"></label><label>Segredo da sessão<input type="password" name="DASHBOARD_SESSION_SECRET" value="{{ values.DASHBOARD_SESSION_SECRET }}"></label><label>Tema padrão<select name="DASHBOARD_DEFAULT_THEME"><option value="system" {% if values.DASHBOARD_DEFAULT_THEME == 'system' %}selected{% endif %}>Sistema</option><option value="light" {% if values.DASHBOARD_DEFAULT_THEME == 'light' %}selected{% endif %}>Claro</option><option value="dark" {% if values.DASHBOARD_DEFAULT_THEME == 'dark' %}selected{% endif %}>Escuro</option></select></label><label>Atualização em segundos<input type="number" min="15" max="3600" name="REFRESH_SECONDS" value="{{ values.REFRESH_SECONDS }}"></label></div><h2>PBS</h2><div class="form-grid"><label>URL<input name="PBS_URL" value="{{ values.PBS_URL }}"></label><label>Token ID<input name="PBS_TOKEN_ID" value="{{ values.PBS_TOKEN_ID }}"></label><label>Token Secret<input type="password" name="PBS_TOKEN_SECRET" value="{{ values.PBS_TOKEN_SECRET }}"></label><label>Datastores<input name="PBS_DATASTORES" value="{{ values.PBS_DATASTORES }}"></label><label>Nó PBS<input name="PBS_NODE" value="{{ values.PBS_NODE }}"></label><label>Validar TLS<select name="PBS_VERIFY_TLS"><option value="true" {% if values.PBS_VERIFY_TLS|lower == 'true' %}selected{% endif %}>Sim</option><option value="false" {% if values.PBS_VERIFY_TLS|lower == 'false' %}selected{% endif %}>Não</option></select></label></div><div class="settings-note">Salvar cria backup do ENV. Reinício do serviço é necessário.</div><footer><a class="text-button" href="/">Cancelar</a><button class="primary-button" type="submit">Salvar configurações</button></footer><p id="settings-message" class="message" hidden></p></form></main><script src="/static/settings.js" defer></script></body></html>
