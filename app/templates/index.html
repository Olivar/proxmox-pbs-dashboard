<!doctype html>
<html lang="pt-BR" data-theme="{{ default_theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-refresh-seconds="{{ refresh_seconds }}" data-csrf="{{ csrf }}" data-default-theme="{{ default_theme }}">
  <header class="app-bar">
    <div class="app-title"><span class="material-symbol">visibility</span><div><strong>{{ title }}</strong><small id="last-update">Carregando…</small></div></div>
    <div class="app-actions">
      <label class="theme-control" title="Tema"><span class="material-symbol">contrast</span><select id="theme-select"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
      <button id="refresh" class="icon-button" title="Atualizar" aria-label="Atualizar"><span class="material-symbol">refresh</span></button>
      <a class="icon-button" href="/settings" title="Configurações" aria-label="Configurações"><span class="material-symbol">settings</span></a>
      <button id="logout" class="icon-button" title="Sair" aria-label="Sair"><span class="material-symbol">logout</span></button>
    </div>
  </header>

  <main class="shell">
    <section id="source-status" class="source-status"></section>

    <nav class="tabs" aria-label="Seções">
      <button class="tab active" data-tab="monitoring">Monitoramento</button>
      <button class="tab" data-tab="backups">Backups</button>
    </nav>

    <section class="filter-bar">
      <label class="search-box"><span class="material-symbol">search</span><input id="search" type="search" placeholder="Pesquisar nome, ID, IP, PVE ou nota" autocomplete="off"></label>
      <select id="filter-state" aria-label="Status"><option value="all">Todos os status</option><option value="running">Ligados</option><option value="stopped">Desligados</option></select>
      <select id="filter-pve" aria-label="PVE"><option value="all">Todos os PVE</option></select>
      <button id="clear-filters" class="text-button">Limpar</button>
    </section>

    <section id="monitoring-panel" class="tab-panel active">
      <section class="summary-strip">
        <span><b id="metric-total">—</b> Total</span><span><b id="metric-running">—</b> Ligados</span><span><b id="metric-stopped">—</b> Desligados</span><span id="vm-count"></span>
      </section>
      <section class="data-card">
        <div class="table-wrap">
          <table class="dense-table">
            <thead><tr><th>Status</th><th>ID</th><th>Nome</th><th>Ações</th><th>IP</th><th>Uso</th><th>Uptime</th><th>PVE</th><th class="notes-col">Notas</th></tr></thead>
            <tbody id="vm-table"></tbody>
          </table>
        </div>
      </section>
    </section>

    <section id="backups-panel" class="tab-panel">
      <section class="data-card">
        <div class="table-wrap">
          <table class="dense-table"><thead><tr><th>Status</th><th>ID</th><th>Nome</th><th>Último backup</th><th>Datastore</th><th>PVE</th></tr></thead><tbody id="backup-table"></tbody></table>
        </div>
      </section>
    </section>
    <p id="error" class="error" hidden></p>
  </main>

  <dialog id="power-dialog" class="md-dialog">
    <form id="power-form">
      <header><h2 id="power-title">Operação</h2><button type="button" class="icon-button" data-close-dialog="power-dialog"><span class="material-symbol">close</span></button></header>
      <p id="power-description" class="muted"></p>
      <div class="form-grid"><label>Usuário<input id="power-user" required autocomplete="username"></label><label>Realm<select id="power-realm"><option value="pam">pam</option><option value="pve">pve</option></select></label><label>Senha<input id="power-password" type="password" required autocomplete="current-password"></label><label>2FA opcional<input id="power-otp" autocomplete="one-time-code"></label></div>
      <footer><button type="button" class="text-button" data-close-dialog="power-dialog">Cancelar</button><button type="submit" class="primary-button">Confirmar</button></footer>
    </form>
  </dialog>

  <dialog id="note-dialog" class="md-dialog"><form id="note-form"><header><h2 id="note-title">Nota</h2><button type="button" class="icon-button" data-close-dialog="note-dialog"><span class="material-symbol">close</span></button></header><textarea id="note-text" maxlength="4000" rows="7"></textarea><footer><button id="note-delete" type="button" class="danger-text">Excluir</button><span></span><button type="button" class="text-button" data-close-dialog="note-dialog">Cancelar</button><button type="submit" class="primary-button">Salvar</button></footer></form></dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
